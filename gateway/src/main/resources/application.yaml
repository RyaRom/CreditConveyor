spring:
  application:
    name: gateway
feign:
  url:
    application: http://localhost:8082
    deal: http://localhost:8081
  docker-url:
    application: 'http://application:8080/application'
    deal: 'http://deal:8080/deal'
swagger:
  service:
    url: 'http://localhost:8880'
springdoc:
  swagger-ui:
    path: /gateway/swagger-ui/
logging:
  level:
    org:
      springframework:
        web:
          filter:
            CommonsRequestLoggingFilter: DEBUG
