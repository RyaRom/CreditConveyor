version: '3.8'

services:
  application:
    build: application
    container_name: application_mc
    depends_on:
      - deal
  conveyor:
    build: conveyor
    container_name: conveyor_mc
  deal:
    build: deal
    container_name: deal_mc
    ports:
      - "8081:8081"
    depends_on:
      - conveyor
      - kafka
    volumes:
      - /logs
  dossier:
    build: dossier
    container_name: dossier_mc
  gateway:
    build: gateway
    container_name: gateway_mc
    ports:
      - "8080:8080"
    depends_on:
      - application
      - deal
  database:
    image: 'postgres:17.0'
    container_name: database
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=credit_conveyor_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    expose:
      - 2181
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: cc-kafka
    expose:
      - 9092
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CREATE_TOPICS: "conveyor-finish-registration:1:1, conveyor-create-documents:1:1, conveyor-send-documents:1:1, conveyor-send-ses:1:1, conveyor-credit-issued:1:1, conveyor-application-denied:1:1, audit-action:1:1"